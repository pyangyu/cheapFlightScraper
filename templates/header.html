<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles/main.css">
</head>
<body>
    <header class="search-header">
        <div class="container mt-4">
            <h1 class="text-center mb-4">Flight Search</h1>
            
            <div class="search-box">
                <form id="flight-search-form" method="POST" action="/result">
                    <div class="row">
                        <div class="col-md-3">
                            <label for="from_airport" class="form-label">From</label>
                            <input type="text" class="form-control" id="from_airport" name="from_airport" placeholder="City or airport">
                            <div id="from_results" class="autocomplete-results"></div>
                        </div>
                        <div class="col-md-3">
                            <label for="to_airport" class="form-label">To (Optional)</label>
                            <input type="text" class="form-control" id="to_airport" name="to_airport" placeholder="City or airport">
                            <div id="to_results" class="autocomplete-results"></div>
                        </div>
                        <div class="col-md-3">
                            <label for="outbound_date" class="form-label">Departure Date</label>
                            <input type="date" class="form-control" id="outbound_date" name="outbound_date">
                        </div>
                        <div class="col-md-3">
                            <label for="return_date" class="form-label">Return Date</label>
                            <input type="date" class="form-control" id="return_date" name="return_date">
                        </div>
                    </div>
                    <div class="container mt-3">
                        <div class="row align-items-center">
                            <!-- Checkbox to enable/disable "To (Optional)" -->
                            <div class="col-auto">
                                <div class="form-check d-flex align-items-center">
                                    <input type="checkbox" class="form-check-input me-2" id="enable_to" onclick="toggleToInput()">
                                    <label class="form-check-label" for="enable_to">Disable Destination</label>
                                </div>
                            </div>

                            <!-- Error message -->
                            <div class="col d-flex justify-content-center">
                                <div id="error-message" class="text-danger" style="display: none;">Please enter the From</div>
                            </div>

                            <!-- Checkbox for "Disable Dates" -->
                            <div class="col-auto">
                                <div class="form-check d-flex justify-content-end align-items-center">
                                    <input type="checkbox" class="form-check-input me-2" id="enable_dates" onclick="toggleDateInputs()">
                                    <label class="form-check-label" for="enable_dates">Disable Dates</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="text-center mt-3">
                        <button type="button" class="btn btn-primary search-button" onclick="validateForm()">Search</button>
                    </div>
                </form>
            </div>
        </div>
    </header>
    <script src="/static/scripts/autocomplete.js"></script>
</body>
</html>
