name: Scheduled Flight Script

on:
  workflow_dispatch:  # ✅ 允许手动触发
  schedule:           # ✅ 每天自动触发
    - cron: "25 5 * * *"  # ⏰ UTC 时间 05:25 = CDT 12:25 AM in daylight saving time!

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests lxml

      - name: Debug List files
        run: ls -al
      
      - name: Run pa-test.py
        run: |
          python pa-test.py || echo "pa-test.py exited with code $?"

      - name: Debug list & peek output
        run: |
          echo "Working dir: $(pwd)"
          ls -al .
          if [ -f flights_output_new.json ]; then
            echo "=== flights_output_new.json head ==="
            head -n 20 flights_output_new.json
          else
            echo "!!! flights_output_new.json not found !!!"
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add flights_output_new.json
          git commit -m "Update flights_output_new.json (scheduled)" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
